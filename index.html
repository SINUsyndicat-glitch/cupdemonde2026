        function isPredictionOpen(matchTimeStr) {
            const now = new Date().getTime();

            const startLimit = matchTime - (24 * 60 * 60 * 1000); // قبل 24 ساعة
            const endLimit = matchTime - (30 * 60 * 1000);       // قبل 30 دقيقة
            return now >= startLimit && now <= endLimit;
        }
function renderMatches(phase) {
